<title>Cubix Doc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FAF6F4; --surface:#FFFFFF; --surface-2:#F4ECEE; --surface-3:#EFE4E8;
  --border:#E8DCDE; --border-strong:#DAC9CF;
  --text:#241E22; --text-2:#756A6E; --text-3:#9A8E92;
  --accent:#8E4E6E; --accent-2:#6E3A54; --accent-soft:#F5E6EE; --on-accent:#FFFFFF;
  --good:#2F7D6B; --good-soft:#E4F1EC; --warn:#A9741B; --warn-soft:#F6EBD6; --crit:#BC4B4B; --crit-soft:#F7E3E3;
  --shadow:0 1px 2px rgba(36,30,34,.04), 0 6px 20px rgba(36,30,34,.06);
  --shadow-sm:0 1px 2px rgba(36,30,34,.06);
  --radius:14px; --radius-sm:10px;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#161214; --surface:#201A1E; --surface-2:#2A2327; --surface-3:#332A2F;
    --border:#382F34; --border-strong:#4A3E44;
    --text:#F2E9ED; --text-2:#B7A6AE; --text-3:#877B81;
    --accent:#DB92B4; --accent-2:#E7A9C4; --accent-soft:#33232C; --on-accent:#221319;
    --good:#5EB79E; --good-soft:#20302C; --warn:#DDA85A; --warn-soft:#332A1C; --crit:#E28585; --crit-soft:#3A2626;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#161214; --surface:#201A1E; --surface-2:#2A2327; --surface-3:#332A2F;
  --border:#382F34; --border-strong:#4A3E44;
  --text:#F2E9ED; --text-2:#B7A6AE; --text-3:#877B81;
  --accent:#DB92B4; --accent-2:#E7A9C4; --accent-soft:#33232C; --on-accent:#221319;
  --good:#5EB79E; --good-soft:#20302C; --warn:#DDA85A; --warn-soft:#332A1C; --crit:#E28585; --crit-soft:#3A2626;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.15;text-wrap:balance}
p{margin:0}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- Shell ---------- */
.app{display:flex;min-height:100vh}
.side{position:sticky;top:0;align-self:flex-start;height:100vh;width:236px;flex:0 0 236px;background:var(--surface);border-right:1px solid var(--border);padding:22px 16px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:var(--on-accent);font-family:var(--serif);font-weight:700;font-size:18px;box-shadow:var(--shadow-sm)}
.brand .n{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:-.01em}
.brand .s{font-size:11px;color:var(--text-3);letter-spacing:.04em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--radius-sm);color:var(--text-2);font-weight:500;transition:background .12s,color .12s}
.nav a svg{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;fill:none;stroke-width:1.7}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a .badge{margin-left:auto;background:var(--crit);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;padding:0 5px;border-radius:10px;display:grid;place-items:center}
.side .spacer{flex:1}
.side .foot{font-size:11.5px;color:var(--text-3);padding:10px 8px 0;border-top:1px solid var(--border);line-height:1.4}
.side .theme{display:flex;gap:6px;padding:6px 8px}
.side .theme button{flex:1;padding:6px;border-radius:8px;border:1px solid var(--border);color:var(--text-2);font-size:12px}
.side .theme button.on{background:var(--surface-2);color:var(--text);border-color:var(--border-strong)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1060px;margin:0 auto;padding:28px 28px 72px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.topbar .eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:5px}
.topbar h1{font-family:var(--serif);font-size:29px;letter-spacing:-.02em}
.topbar .sub{color:var(--text-2);margin-top:6px;max-width:56ch}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid transparent;transition:transform .06s,box-shadow .12s,background .12s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.btn.pri{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-sm)}
.btn.pri:hover{background:var(--accent-2)}
.btn.ghost{background:var(--surface);color:var(--text);border-color:var(--border-strong)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.wa{background:#25D366;color:#0b2e17}
.btn.wa:hover{background:#1fb457}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.danger:hover{background:var(--crit-soft)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Cards / grid ---------- */
.grid{display:grid;gap:16px}
.metrics{grid-template-columns:repeat(auto-fill,minmax(184px,1fr))}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow-sm)}
.tile .lab{font-size:12.5px;color:var(--text-2);font-weight:500;display:flex;align-items:center;gap:7px}
.tile .num{font-family:var(--serif);font-size:33px;font-weight:600;letter-spacing:-.02em;margin-top:9px;line-height:1}
.tile .num small{font-size:16px;color:var(--text-2);font-weight:500;font-family:var(--sans)}
.tile .hint{font-size:12px;color:var(--text-3);margin-top:7px}
.tile .hint b{color:var(--text-2);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.panel .ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--border)}
.panel .ph h3{font-size:15.5px}
.panel .pb{padding:16px 18px}
.cols2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}

/* ---------- Bars (procedimientos) ---------- */
.bar{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;margin-bottom:11px}
.bar:last-child{margin-bottom:0}
.bar .bl{font-size:13.5px;font-weight:500}
.bar .bv{font-size:13px;color:var(--text-2);font-weight:600}
.bar .track{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:6px}

/* ---------- List / rows ---------- */
.rowlist{display:flex;flex-direction:column}
.rowlink{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid var(--border);text-align:left;width:100%;transition:background .1s}
.rowlink:last-child{border-bottom:none}
.rowlink:hover{background:var(--surface-2)}
.avatar{width:40px;height:40px;flex:0 0 40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:15px;font-family:var(--serif)}
.rowlink .info{min-width:0;flex:1}
.rowlink .nm{font-weight:600;display:flex;align-items:center;gap:8px}
.rowlink .mt{font-size:12.5px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowlink .rt{text-align:right;font-size:12.5px;color:var(--text-3);flex:0 0 auto}

/* ---------- Pills / chips ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;letter-spacing:.01em}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.neutral{background:var(--surface-2);color:var(--text-2)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.tag{display:inline-block;padding:3px 9px;border:1px solid var(--border-strong);border-radius:8px;font-size:12px;color:var(--text-2);background:var(--surface)}

/* ---------- Alert band (contraindicaciones) ---------- */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:11px;padding:11px 14px;border-radius:var(--radius-sm);border-left:4px solid;font-size:13.5px}
.alert.crit{background:var(--crit-soft);border-color:var(--crit)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn)}
.alert .ai{flex:0 0 auto;font-weight:700}
.alert b{font-weight:700}

/* ---------- Forms ---------- */
.form{display:flex;flex-direction:column;gap:22px}
.fset{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.fset>legend,.fset>.lh{display:block;width:100%;padding:14px 18px;border-bottom:1px solid var(--border);font-weight:600;font-size:15px;font-family:var(--serif)}
.fset .fb{padding:16px 18px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px 16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:600;color:var(--text-2)}
.field .help{font-size:11.5px;color:var(--text-3)}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);color:var(--text);transition:border-color .12s,box-shadow .12s}
.field textarea{resize:vertical;min-height:64px;line-height:1.45}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);cursor:pointer;font-size:13px;user-select:none;transition:.12s}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.chk:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.formbar{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 60%,transparent);padding:14px 0 4px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* signature */
.sig{border:1px dashed var(--border-strong);border-radius:10px;background:var(--surface-2);touch-action:none;width:100%;max-width:420px;height:150px;display:block}

/* ---------- Section head ---------- */
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 13px}
.shead h2{font-family:var(--serif);font-size:20px;letter-spacing:-.01em}
.crumbs{font-size:13px;color:var(--text-2);margin-bottom:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.crumbs a{color:var(--text-2);font-weight:500}
.crumbs a:hover{color:var(--accent)}

/* ---------- Empty ---------- */
.empty{text-align:center;padding:46px 20px;color:var(--text-2)}
.empty .ei{width:52px;height:52px;margin:0 auto 14px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.empty .ei svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6}
.empty h3{font-family:var(--serif);font-size:19px;margin-bottom:6px;color:var(--text)}

/* ---------- Data list (key/value) ---------- */
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:11px 20px}
.kv .k{font-size:12px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kv .v{font-size:14.5px;margin-top:2px}
.kv .item.full{grid-column:1/-1}

/* ---------- Modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,14,17,.5);backdrop-filter:blur(2px);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);max-width:460px;width:100%;overflow:hidden}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--border);font-family:var(--serif);font-weight:600;font-size:17px}
.modal .mb{padding:18px 20px;color:var(--text-2)}
.modal .mf{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}

.demo-flag{display:inline-block;background:var(--surface-3);color:var(--text-3);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:6px}
.notice{background:var(--accent-soft);border:1px solid transparent;color:var(--accent-2);border-radius:var(--radius-sm);padding:11px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
:root[data-theme="dark"] .notice,:root:not([data-theme="light"]) .notice{color:var(--accent)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:var(--shadow);z-index:80;opacity:0;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

@media (max-width:860px){
  .app{flex-direction:column}
  .side{position:sticky;top:0;z-index:30;flex-direction:row;width:auto;height:auto;flex:none;align-items:center;gap:4px;padding:10px 12px;overflow-x:auto}
  .brand{padding:0 10px 0 4px}.brand .s{display:none}
  .nav{flex-direction:row;margin:0}
  .nav a{padding:8px 11px;white-space:nowrap}.nav a span.lbl{display:none}
  .nav a svg{width:20px;height:20px}
  .side .spacer,.side .foot{display:none}
  .side .theme{padding:0}.side .theme button{padding:7px 9px}
  .wrap{padding:20px 16px 72px}
  .cols2{grid-template-columns:1fr}
  .fset .fb{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="mark">C</div>
      <div><div class="n">Cubix Doc</div><div class="s">Ficha de cliente</div></div>
    </div>
    <nav class="nav" id="nav">
      <a href="#/" data-r="dash">${''}</a>
    </nav>
    <div class="spacer"></div>
    <div class="side theme" style="border:0;padding:6px 8px">
      <button data-theme-btn="light">Claro</button>
      <button data-theme-btn="dark">Oscuro</button>
      <button data-theme-btn="system">Auto</button>
    </div>
    <div class="foot">Sistema Cubix Doc · Estudios Cubix<br><span id="storemode">Conectando…</span></div>
  </aside>
  <div class="main"><div class="wrap" id="view"></div></div>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================ Cubix Doc ============================================================
   Sistema Cubix Doc (SCD) — panel único de ficha de cliente para esteticistas.
   Modelo: Cliente (datos + anamnesis) -> Sesión (evaluación + consentimiento + seguimiento). Métricas y automatizaciones derivadas.
   Persistencia: capability `db` (compartida). Fallback: localStorage si el visor no puede correr db.
=================================================================================================================================== */

/* ---------- ICONS ---------- */
const IC={
  dash:'<path d="M3 13h8V3H3zM13 21h8v-8h-8zM13 3v6h8V3zM3 21h8v-6H3z"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  bolt:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  back:'<path d="M19 12H5M12 19l-7-7 7-7"/>',
  wa:'<path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.4 8.4 0 0 1-4-1L3 21l1.9-5A8.4 8.4 0 0 1 4 12 8.38 8.38 0 0 1 12.5 3.5 8.38 8.38 0 0 1 21 11.5z"/>',
  add:'<circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  star:'<path d="M12 2l3 6.5 7 .9-5 4.8 1.3 7L12 18l-6.6 3.2L6.7 14 1.7 9.4l7-.9z"/>'
};
function icon(n){return '<svg viewBox="0 0 24 24">'+(IC[n]||'')+'</svg>';}

/* ---------- STATE ---------- */
let DBNS=null, mode='local', clientes=[], sesiones=[], servicios=[], config={};
const LS={c:'cubixdoc_clientes',s:'cubixdoc_sesiones',serv:'cubixdoc_servicios',cfg:'cubixdoc_config'};
const DIAS_INACTIVA=60;

const PROCS=["Limpieza facial profunda","Hidrafacial","Peeling químico","Dermaplaning","Microneedling","Radiofrecuencia facial","Máscara LED","Depilación láser","Depilación con cera","Masaje reductor","Drenaje linfático","Radiofrecuencia corporal","Ultracavitación","Presoterapia","Tratamiento anti-celulitis","Maderoterapia","Diseño de cejas","Lifting de pestañas"];

/* ---------- HELPERS ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nowISO=()=>new Date().toISOString();
function fmtD(iso){if(!iso)return '—';const d=new Date(iso);if(isNaN(d))return '—';return d.toLocaleDateString('es-AR',{day:'2-digit',month:'short',year:'numeric'});}
function fmtDshort(iso){if(!iso)return '—';const d=new Date(iso);if(isNaN(d))return '—';return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});}
function daysSince(iso){if(!iso)return Infinity;return Math.floor((Date.now()-new Date(iso))/864e5);}
function daysUntil(iso){if(!iso)return null;return Math.ceil((new Date(iso)-Date.now())/864e5);}
function money(n){n=Number(n)||0;return '$'+n.toLocaleString('es-AR');}
function initials(n){return (n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();}
function edad(iso){if(!iso)return null;const d=new Date(iso);if(isNaN(d))return null;const t=new Date();let a=t.getFullYear()-d.getFullYear();const m=t.getMonth()-d.getMonth();if(m<0||(m===0&&t.getDate()<d.getDate()))a--;return a>=0&&a<130?a:null;}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}

function sesionesDe(cid){return sesiones.filter(s=>s.clienteId===cid).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));}
function cliente(id){return clientes.find(c=>c.id===id);}

/* ---------- STORAGE ---------- */
async function initStore(){
  render(); // paint immediately (empty/loading)
  try{DBNS=await window.claude?.use?.('db');}catch(e){DBNS=null;}
  if(DBNS){
    mode='db';$('#storemode').textContent='● Base compartida (db)';$('#storemode').style.color='var(--good)';
    try{
      DBNS.collection('clientes').onSnapshot(snap=>{clientes=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));onData();},e=>console.warn('db clientes',e));
      DBNS.collection('sesiones').onSnapshot(snap=>{sesiones=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));onData();},e=>console.warn('db sesiones',e));
      DBNS.collection('servicios').onSnapshot(snap=>{servicios=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));onData();},e=>console.warn('db servicios',e));
      DBNS.doc('config/general').onSnapshot(snap=>{config=snap.exists?snap.data():{};onData();},()=>{});
    }catch(e){fallbackLocal();}
  }else{fallbackLocal();}
}
function fallbackLocal(){
  mode='local';$('#storemode').textContent='● Local (este navegador)';$('#storemode').style.color='var(--warn)';
  try{clientes=JSON.parse(localStorage.getItem(LS.c)||'[]');sesiones=JSON.parse(localStorage.getItem(LS.s)||'[]');servicios=JSON.parse(localStorage.getItem(LS.serv)||'[]');config=JSON.parse(localStorage.getItem(LS.cfg)||'{}');}catch(e){clientes=[];sesiones=[];servicios=[];config={};}
  onData();
}
function persistLocal(){try{localStorage.setItem(LS.c,JSON.stringify(clientes));localStorage.setItem(LS.s,JSON.stringify(sesiones));localStorage.setItem(LS.serv,JSON.stringify(servicios));localStorage.setItem(LS.cfg,JSON.stringify(config));}catch(e){}}

async function saveCliente(c){
  c.updatedAt=nowISO();if(!c.createdAt)c.createdAt=nowISO();
  if(mode==='db'){const{id,...body}=c;await DBNS.collection('clientes').doc(id).set(body);}
  else{const i=clientes.findIndex(x=>x.id===c.id);if(i>=0)clientes[i]=c;else clientes.push(c);persistLocal();onData();}
}
async function saveSesion(s){
  s.updatedAt=nowISO();if(!s.createdAt)s.createdAt=nowISO();
  if(mode==='db'){const{id,...body}=s;await DBNS.collection('sesiones').doc(id).set(body);}
  else{const i=sesiones.findIndex(x=>x.id===s.id);if(i>=0)sesiones[i]=s;else sesiones.push(s);persistLocal();onData();}
}
async function delCliente(id){
  if(mode==='db'){await DBNS.collection('clientes').doc(id).delete();for(const s of sesionesDe(id))await DBNS.collection('sesiones').doc(s.id).delete();}
  else{clientes=clientes.filter(c=>c.id!==id);sesiones=sesiones.filter(s=>s.clienteId!==id);persistLocal();onData();}
}
async function delSesion(id){
  if(mode==='db'){await DBNS.collection('sesiones').doc(id).delete();}
  else{sesiones=sesiones.filter(s=>s.id!==id);persistLocal();onData();}
}
async function saveConfig(cfg){
  config=cfg;
  if(mode==='db'){await DBNS.doc('config/general').set(cfg);}
  else{persistLocal();onData();}
}
async function saveServicio(v){
  v.updatedAt=nowISO();if(!v.createdAt)v.createdAt=nowISO();
  if(mode==='db'){const{id,...body}=v;await DBNS.collection('servicios').doc(id).set(body);}
  else{const i=servicios.findIndex(x=>x.id===v.id);if(i>=0)servicios[i]=v;else servicios.push(v);persistLocal();onData();}
}
async function delServicio(id){
  if(mode==='db'){await DBNS.collection('servicios').doc(id).delete();}
  else{servicios=servicios.filter(s=>s.id!==id);persistLocal();onData();}
}

/* ---------- CLINICAL ALERTS (contraindicaciones) ---------- */
function alertas(c){
  const a=c.anamnesis||{},out=[];const ant=a.antecedentes||[],med=a.medFlags||[],alg=a.alergias||[];
  const crit=(t)=>out.push({n:'crit',t});const warn=(t)=>out.push({n:'warn',t});
  if(a.embarazo==='embarazo')crit('Embarazo — contraindica radiofrecuencia, ultracavitación, presoterapia y peelings/activos fuertes.');
  if(a.embarazo==='lactancia')warn('Lactancia — evitar aparatología reductora y activos de alta penetración; consultar tratamientos.');
  if(a.marcapasos)crit('Marcapasos / implante metálico — contraindica corrientes, radiofrecuencia y ultracavitación.');
  if(med.includes('Isotretinoína (Roacután)'))crit('Isotretinoína — contraindica peeling, dermaplaning, microneedling y láser (esperar ~6 meses tras finalizar).');
  if(med.includes('Anticoagulantes'))warn('Anticoagulantes — riesgo de sangrado/hematoma en microneedling y procedimientos invasivos.');
  if(ant.includes('Oncológico'))crit('Antecedente oncológico — requiere apto médico antes de cualquier tratamiento.');
  if(ant.includes('Epilepsia'))warn('Epilepsia — precaución con LED y electroestimulación.');
  if(ant.includes('Diabetes'))warn('Diabetes — cicatrización más lenta; extremar asepsia y controlar procedimientos invasivos.');
  if(a.herpes)warn('Herpes labial recurrente — considerar profilaxis antes de peeling/microneedling facial.');
  if(a.queloides)warn('Tendencia a queloides — precaución con microneedling y procedimientos que generen microlesión.');
  if(['IV','V','VI'].includes(a.fototipo))warn('Fototipo '+a.fototipo+' — mayor riesgo de hiperpigmentación con láser y peelings; ajustar parámetros.');
  if(alg.length)warn('Alergias declaradas: '+alg.join(', ')+' — verificar composición de productos.');
  return out;
}

/* ---------- METRICS ---------- */
function metrics(){
  const conSesion=clientes.filter(c=>sesionesDe(c.id).length>0);
  const activas=clientes.filter(c=>{const ss=sesionesDe(c.id);return ss.length&&daysSince(ss[0].fecha)<=DIAS_INACTIVA;});
  const inactivas=conSesion.filter(c=>!activas.includes(c));
  const recurrentes=conSesion.filter(c=>sesionesDe(c.id).length>=2);
  const retencion=conSesion.length?Math.round(recurrentes.length/conSesion.length*100):0;
  // ticket & ingresos mes
  const m=new Date();const mesIni=new Date(m.getFullYear(),m.getMonth(),1).toISOString();
  const sesMes=sesiones.filter(s=>(s.fecha||'')>=mesIni);
  const conPrecio=sesiones.filter(s=>Number(s.precio)>0);
  const ticket=conPrecio.length?Math.round(conPrecio.reduce((a,s)=>a+Number(s.precio),0)/conPrecio.length):0;
  const ingresosMes=sesMes.reduce((a,s)=>a+(Number(s.precio)||0),0);
  // frecuencia retorno
  let gaps=[];conSesion.forEach(c=>{const f=sesionesDe(c.id).map(s=>s.fecha).filter(Boolean).sort();for(let i=1;i<f.length;i++)gaps.push((new Date(f[i])-new Date(f[i-1]))/864e5);});
  const frecuencia=gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length):null;
  // procedimientos top
  const cnt={};sesiones.forEach(s=>{if(s.procedimiento)cnt[s.procedimiento]=(cnt[s.procedimiento]||0)+1;});
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,6);
  // cumplimiento seguimiento
  const conCita=sesiones.filter(s=>s.seguimiento&&s.seguimiento.proximaCita&&daysUntil(s.seguimiento.proximaCita)<0);
  const cumplidos=conCita.filter(s=>s.seguimiento.realizado);
  const cumplimiento=conCita.length?Math.round(cumplidos.length/conCita.length*100):null;
  return {total:clientes.length,activas:activas.length,inactivas,recurrentes:recurrentes.length,retencion,ticket,ingresosMes,sesMes:sesMes.length,frecuencia,top,cumplimiento,conCita:conCita.length};
}

/* ---------- AUTOMATION QUEUES ---------- */
function autoQueues(){
  const post=[],record=[],react=[];
  sesiones.forEach(s=>{const c=cliente(s.clienteId);if(!c)return;
    const d=daysSince(s.fecha);
    if(d>=0&&d<=3&&!(s.postCuidadoEnviado))post.push({c,s});
  });
  sesiones.forEach(s=>{const c=cliente(s.clienteId);if(!c)return;const sg=s.seguimiento||{};
    const du=daysUntil(sg.proximaCita);
    if(sg.proximaCita&&du!==null&&du<=3&&!sg.realizado&&!s.recordatorioEnviado)record.push({c,s,du});
  });
  const m=metrics();m.inactivas.forEach(c=>{const ss=sesionesDe(c.id);react.push({c,dias:daysSince(ss[0].fecha)});});
  post.sort((a,b)=>(b.s.fecha||'').localeCompare(a.s.fecha||''));
  record.sort((a,b)=>a.du-b.du);
  react.sort((a,b)=>b.dias-a.dias);
  return {post,record,react};
}

/* ---------- AUTOMATIZACIONES ---------- */
function viewAuto(){
  const q=autoQueues();
  const card=(title,desc,items,render)=>`<div class="panel" style="margin-bottom:16px"><div class="ph"><h3>${title}</h3><span class="pill ${items.length?'accent':'neutral'} tnum">${items.length}</span></div>
    <div class="pb" style="padding-bottom:8px"><p style="color:var(--text-2);font-size:13px;margin-bottom:${items.length?'4px':'0'}">${desc}</p></div>
    ${items.length?`<div class="rowlist" style="border-top:1px solid var(--border)">${items.map(render).join('')}</div>`:'<div class="pb" style="padding-top:0;color:var(--text-3);font-size:14px">Nada pendiente. ✨</div>'}</div>`;
  return `
  <div class="topbar"><div><div class="eyebrow">Se disparan solas del registro</div><h1>Automatización</h1>
    <p class="sub">Los mismos eventos que en producción dispararían n8n + WAHA. Acá generás el WhatsApp listo para enviar y lo marcás como hecho.</p></div></div>
  <div class="notice" style="margin-bottom:18px"><span>🔗</span><div>Cada botón abre WhatsApp con el mensaje pre-armado (link <b>wa.me</b>). En la versión escalable (n8n + WAHA + Postgres) estos envíos se automatizan sin intervención.</div></div>

let sigCtx=null,sigDirty=false,sigExisting=null;
function initSig(existing){
  const cv=$('#sigpad');if(!cv)return;sigExisting=existing||null;
  const rect=cv.getBoundingClientRect();cv.width=rect.width*2;cv.height=rect.height*2;
  sigCtx=cv.getContext('2d');sigCtx.scale(2,2);sigCtx.lineWidth=2;sigCtx.lineCap='round';
  sigCtx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--text')||'#000';
  if(existing){const img=new Image();img.onload=()=>sigCtx.drawImage(img,0,0,rect.width,rect.height);img.src=existing;}
  let drawing=false,px,py;
  const pos=e=>{const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return[t.clientX-r.left,t.clientY-r.top];};
  const start=e=>{drawing=true;[px,py]=pos(e);e.preventDefault();};
  const move=e=>{if(!drawing)return;const[x,y]=pos(e);sigCtx.beginPath();sigCtx.moveTo(px,py);sigCtx.lineTo(x,y);sigCtx.stroke();[px,py]=[x,y];sigDirty=true;$('#sigstate').textContent='Firma registrada ✓';e.preventDefault();};
  const end=()=>{drawing=false;};
  cv.addEventListener('pointerdown',start);cv.addEventListener('pointermove',move);
  window.addEventListener('pointerup',end);
}
function clearSig(){const cv=$('#sigpad');if(!cv)return;sigCtx.clearRect(0,0,cv.width,cv.height);sigDirty=true;sigExisting=null;$('#sigstate').textContent='Sin firmar';}
function sigData(){const cv=$('#sigpad');if(sigDirty){ // check if blank
    return sigIsBlank()?'':cv.toDataURL('image/png');}
  return sigExisting||'';}
function sigIsBlank(){const cv=$('#sigpad');const blank=document.createElement('canvas');blank.width=cv.width;blank.height=cv.height;return cv.toDataURL()===blank.toDataURL();}
